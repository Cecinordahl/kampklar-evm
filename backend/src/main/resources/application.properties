spring.application.name=backend
server.port=${PORT:8080}

# Firebase Admin SDK service account, as raw JSON (not a file path) - see .env.example.
# Left blank, Firebase init is skipped (e.g. for `mvn test` without secrets configured).
firebase.service-account-json=${FIREBASE_SERVICE_ACCOUNT_JSON:}

# UID of the single provisioned admin account (from Firebase Auth), used to authorize /admin/** writes
app.admin-uid=${ADMIN_UID:}

# Deployed frontend origin, for CORS on /admin/** endpoints
app.frontend-origin=${FRONTEND_ORIGIN:http://localhost:5173}

# Anthropic API key for the "Oppdater lagdata" research refresh (backend-only secret)
anthropic.api-key=${ANTHROPIC_API_KEY:}
